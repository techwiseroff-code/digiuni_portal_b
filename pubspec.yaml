name: digiuni_portal
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  icons_launcher: ^2.1.7
  flutter_svg: ^2.0.9
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  mime: ^1.0.4
  path: ^1.8.3
  cloud_firestore: ^5.0.0
  provider: ^6.1.2
  intl: ^0.19.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

icons_launcher:
  image_path: "assets/logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - .env